<section class="w-full">
    <p-toast></p-toast>

    <div class="flex align-items-center gap-2 mb-4">
        <icon-newspaper fill="var(--primary-color)"></icon-newspaper>
        <div class="text-sm font-semibold">E-Paper</div>
        <icon-info></icon-info>
    </div>

    <!-- Section Pencarian Buku -->
    <div class="card mb-4">
        <div class="text-sm font-semibold mb-3">Pencarian Buku</div>
        <p-divider class="mb-3"></p-divider>

        <form (ngSubmit)="onSearch()" class="grid">
            <!-- Judul -->
            <div class="col-12 md:col-8">
                <div class="field">
                    <label for="judul" class="block text-sm font-medium mb-2">
                        Judul
                    </label>
                    <input pInputText id="judul" name="judul" [(ngModel)]="searchForm.judul"
                        placeholder="Cari berdasarkan judul..." class="w-full ml-1" />
                </div>
            </div>

            <!-- Buttons -->
            <div class="col-12 md:col-4">
                <div class="field">
                    <!-- spacer label to align height -->
                    <label class="block text-sm font-medium mb-2">&nbsp;</label>

                    <div class="flex gap-2 justify-content-end">
                        <!-- <button pButton type="button" label="Reset" severity="secondary" class="p-button-outlined"
                            (click)="onResetSearch()">
                        </button> -->

                        <button pButton type="submit" label="Cari" icon="pi pi-search">
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <!-- <p-divider></p-divider> -->

    <spinner [spinning]="isLoading" class="w-full">
        <!-- EPAPER GRID -->
        <div class="epaper-grid my-3" *ngIf="epapers && epapers.length > 0; else emptyState">
            <div *ngFor="let book of epapers" class="epaper-card">
                <div class="book-card app-card border-round-lg border-1 shadow-2 p-3 h-full flex flex-column cursor-pointer hover:shadow-5 transition-all duration-500"
                    (click)="openPdf(book)">

                    <!-- Book Cover -->
                    <div class="book-cover-container mb-3">
                        <div class="book-cover-wrapper">
                            <img [src]="book.thumbnail_url" [alt]="book.title" class="book-cover-image"
                                onerror="this.src='https://placehold.co/600x800/4a5568/ffffff?text=No+Cover&font=playfair'"
                                [title]="book.title" />
                            <div class="book-spine"></div>
                        </div>
                    </div>

                    <!-- Book Info -->
                    <div class="book-info flex-1 text-left w-full">
                        <h4 class="book-title text-sm font-semibold white-space-normal line-clamp-2 mb-2">
                            {{ book.title }}
                        </h4>

                        <div class="book-meta text-xs">
                            <div class="book-author mb-1">
                                <span class="font-medium">{{ book.media_name }}</span>
                            </div>
                            <div class="book-date">
                                {{ book.date | date: 'dd MMM yyyy' }}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- EMPTY STATE -->
        <ng-template #emptyState>
            <div class="flex flex-column align-items-center justify-content-center py-6 text-center">
                <i class="pi pi-info-circle text-4xl mb-3 text-color-secondary"></i>

                <div class="text-sm font-semibold mb-1">
                    Tidak ada data
                </div>

                <div class="text-xs text-color-secondary">
                    Tidak ditemukan epaper dengan kriteria pencarian saat ini.
                </div>
            </div>
        </ng-template>


        <!-- <p-divider></p-divider> -->

        <p-paginator [first]="first" [rows]="rows" [totalRecords]="totalRecords" [rowsPerPageOptions]="[5, 10, 20, 50]"
            [showFirstLastIcon]="false" styleClass="p-0 w-full" (onPageChange)="onPageChange($event)"
            [templateLeft]="customLeftTemplate">

            <ng-template #customLeftTemplate let-state>
                <span class="text-sm text-color">Total Epaper:</span>
                <span class="text-sm text-color font-semibold">
                    {{ state.totalRecords }}
                </span>
            </ng-template>

        </p-paginator>

    </spinner>
</section>
